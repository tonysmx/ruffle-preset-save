<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Binding of Isaac — Modified Ruffle</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
    #state-menu-wrap {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 99999;
    }
    #state-arrow {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 8px;
      background: rgba(0,0,0,.78);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(0,0,0,.45);
    }
    #state-menu {
      margin-top: 6px;
      min-width: 150px;
      padding: 6px;
      border-radius: 8px;
      background: rgba(20,20,20,.96);
      box-shadow: 0 4px 18px rgba(0,0,0,.6);
      display: none;
    }
    #state-menu.open { display: block; }
    #state-menu button {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 5px;
      padding: 9px 10px;
      margin: 2px 0;
      background: #333;
      color: #fff;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
    }
    #state-menu button:hover { background: #444; }
    #state-status {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 100000;
      max-width: min(90vw, 600px);
      padding: 9px 12px;
      border-radius: 7px;
      background: rgba(0,0,0,.85);
      color: #fff;
      font-size: 13px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="state-menu-wrap">
    <button id="state-arrow" aria-label="State menu" title="State menu">▼</button>
    <div id="state-menu">
      <button id="export-state">Export State</button>
      <button id="import-state">Import State</button>
    </div>
  </div>
  <input id="state-file" type="file" accept=".rstate,.json,application/json" hidden>
  <div id="state-status"></div>

  <script src="ruffle.js"></script>
  <script>
    (() => {
      const SWF_URL = "https://cdn.imageurlgenerator.com/uploads/8bc8b86f-095b-4862-b7d8-527989a6ecaa.swf";

      // Keep the initial load paused so imported states can be reconstructed before play resumes.
      window.RufflePlayer = window.RufflePlayer || {};
      window.RufflePlayer.config = {
        ...(window.RufflePlayer.config || {}),
        autoplay: "off"
      };

      const game = document.getElementById("game");
      const arrow = document.getElementById("state-arrow");
      const menu = document.getElementById("state-menu");
      const exportButton = document.getElementById("export-state");
      const importButton = document.getElementById("import-state");
      const fileInput = document.getElementById("state-file");
      const status = document.getElementById("state-status");

      let player = null;
      let statusTimer = null;

      function showStatus(message) {
        status.textContent = message;
        status.style.display = "block";
        clearTimeout(statusTimer);
        statusTimer = setTimeout(() => {
          status.style.display = "none";
        }, 3000);
      }

      arrow.addEventListener("click", (event) => {
        event.stopPropagation();
        menu.classList.toggle("open");
      });

      document.addEventListener("click", (event) => {
        if (!document.getElementById("state-menu-wrap").contains(event.target)) {
          menu.classList.remove("open");
        }
      });

      exportButton.addEventListener("click", () => {
        menu.classList.remove("open");
        try {
          if (!player?.instance?.savestate_export) {
            throw new Error("Save-state support is not present in this Ruffle build.");
          }
          const json = player.instance.savestate_export();
          const blob = new Blob([json], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "isaac-state.rstate";
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showStatus("State exported.");
        } catch (error) {
          console.error(error);
          showStatus("Could not export the state.");
        }
      });

      importButton.addEventListener("click", () => {
        menu.classList.remove("open");
        fileInput.click();
      });

      async function replayState(json) {
        if (!player) throw new Error("The game player is not ready.");
        if (!player.instance?.savestate_import) {
          throw new Error("Save-state support is not present in this Ruffle build.");
        }

        const parsed = JSON.parse(json);
        if (!parsed || parsed.version !== 1) {
          throw new Error("Unsupported state file.");
        }

        showStatus("Loading state…");

        // Reload creates a fresh Ruffle VM. autoplay is disabled above, so no uncontrolled frames
        // run before we install the recorded input log.
        player.pause();
        await player.reload();
        player.pause();

        const targetFrame = player.instance.savestate_import(json);

        // Replay in animation-frame-sized chunks so very long states do not lock the browser for
        // the entire reconstruction.
        let currentFrame = 0;
        while (currentFrame < targetFrame) {
          for (let i = 0; i < 250 && currentFrame < targetFrame; i++) {
            currentFrame = player.instance.savestate_step();
          }
          if (currentFrame < targetFrame) {
            await new Promise(requestAnimationFrame);
          }
        }

        player.instance.savestate_finalize();
        player.play();
        showStatus("State loaded.");
      }

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files?.[0];
        fileInput.value = "";
        if (!file) return;

        try {
          await replayState(await file.text());
        } catch (error) {
          console.error(error);
          showStatus("Could not load that state file.");
        }
      });

      window.addEventListener("load", async () => {
        try {
          const ruffle = window.RufflePlayer.newest();
          player = ruffle.createPlayer();
          player.style.width = "100%";
          player.style.height = "100%";
          game.appendChild(player);
          await player.ruffle().load(SWF_URL);
          player.play();
        } catch (error) {
          console.error("Ruffle failed to load the Binding of Isaac SWF:", error);
          game.innerHTML = '<div style="color:#fff;font:16px Arial;text-align:center;padding:40px">Unable to load the game.</div>';
        }
      });
    })();
  </script>
</body>
</html>
