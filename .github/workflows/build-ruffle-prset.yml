name: Build Ruffle with preset SOL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Clone Ruffle
        uses: actions/checkout@v4
        with:
          repository: ruffle-rs/ruffle
          ref: master
          fetch-depth: 1

      - name: Checkout modifier files
        uses: actions/checkout@v4
        with:
          path: modifier

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install wasm-bindgen
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127

      - name: Apply patched storage backend
        run: cp modifier/web/src/storage.rs web/src/storage.rs

      - name: Build Ruffle web packages
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Package selfhosted build
        run: |
          cd web/packages/selfhosted/dist
          zip -r ../../../ruffle-preset-selfhosted.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruffle-preset-selfhosted
          path: web/ruffle-preset-selfhosted.zip
