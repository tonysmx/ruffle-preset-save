name: Build Ruffle with Isaac preset save + save states

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pinned Ruffle source
        uses: actions/checkout@v4
        with:
          repository: ruffle-rs/ruffle
          ref: 74ade97342205ac55d264f2ceb1e642573a21d48
          fetch-depth: 1

      - name: Checkout modifier files
        uses: actions/checkout@v4
        with:
          path: modifier

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install wasm-bindgen
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127

      - name: Apply existing preset-save backend
        run: cp modifier/web/src/storage.rs web/src/storage.rs

      - name: Apply save-state modification
        run: python3 modifier/patch/apply_savestate.py

      - name: Build modified Ruffle
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Package hostable site
        run: |
          rm -rf site-dist
          mkdir -p site-dist
          cp -R web/packages/selfhosted/dist/. site-dist/
          cp modifier/site/index.html site-dist/index.html
          cd site-dist
          zip -r ../ruffle-isaac-savestate-site.zip .

      - name: Upload hostable site
        uses: actions/upload-artifact@v4
        with:
          name: ruffle-isaac-savestate-site
          path: ruffle-isaac-savestate-site.zip
